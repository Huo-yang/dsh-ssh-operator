name: 功能建议 / Feature request
description: 建议新的使用场景或向后兼容能力
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Use case
      description: 请描述要解决的问题，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: 安全与兼容性 / Safety and compatibility
      description: 说明是否涉及远程执行、凭据、文件写入或公开工具 schema。
